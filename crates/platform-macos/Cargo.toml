[package]
name = "coosenpai-platform-macos"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
plist = "1.10.0"
async-trait.workspace = true
chrono.workspace = true
coosenpai-core = { path = "../core" }
serde.workspace = true
serde_json.workspace = true
reqwest = { workspace = true, features = ["query"] }
tempfile.workspace = true
tokio.workspace = true
tokio-util.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10.1"
core-graphics = { version = "0.25.0", features = ["link"] }
block2 = { version = "0.6.2", default-features = false, features = ["std"] }
objc2 = { version = "0.6.4", default-features = false, features = ["std"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["libc", "NSApplication", "NSResponder", "NSWindow", "NSEvent", "NSView", "block2", "NSWorkspace", "NSRunningApplication", "NSImage", "NSImageRep", "NSBitmapImageRep", "NSGraphicsContext", "NSPasteboard", "NSPasteboardItem", "objc2-core-graphics"] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["CFCGTypes"] }
objc2-core-graphics = { version = "0.3.2", default-features = false, features = ["libc", "CGBitmapContext", "CGColorSpace", "CGContext", "CGDirectDisplay", "CGError", "CGEvent", "CGEventSource", "CGEventTypes", "CGRemoteOperation", "CGGeometry", "CGImage", "CGWindow"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["NSArray", "NSData", "NSDictionary", "NSError", "NSNotification", "NSDistributedNotificationCenter", "NSEnumerator", "NSOperation", "NSObject", "NSString", "NSURL", "block2"] }
objc2-av-foundation = { version = "0.3.2", default-features = false, features = ["std", "AVCaptureDevice", "AVMediaFormat", "block2"] }
objc2-speech = { version = "0.3.2", default-features = false, features = ["std", "SFSpeechRecognizer", "block2"] }
objc2-vision = { version = "0.3.2", default-features = false, features = ["VNObservation", "VNRecognizeTextRequest", "VNRequest", "VNRequestHandler", "VNTypes", "objc2-core-foundation", "objc2-core-graphics"] }
objc2-screen-capture-kit = { version = "0.3.2", default-features = false, features = ["std", "block2", "libc", "SCShareableContent", "SCStream", "SCScreenshotManager", "SCError", "objc2-core-foundation", "objc2-core-graphics"] }

[dev-dependencies]
image.workspace = true
