[workspace]
members = ["crates/core", "crates/platform-macos", "crates/cli", "apps/desktop/src-tauri"]
exclude = ["spikes/macos-tauri-objc2"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "PolyForm-Shield-1.0.0"

[workspace.dependencies]
anyhow = "1.0.100"
async-trait = "0.1.89"
futures-util = "0.3.31"
chrono = { version = "0.4.42", features = ["clock", "serde"] }
clap = { version = "4.5.48", features = ["derive"] }
image = { version = "0.25.8", default-features = false, features = ["png"] }
iana-time-zone = "0.1.64"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "native-tls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
semver = "1.0.28"
sha2 = "0.10.9"
tempfile = "3.23.0"
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["full", "test-util"] }
tokio-util = { version = "0.7.17", features = ["rt"] }
rustix = { version = "1.1.4", features = ["process"] }
uuid = { version = "1.18.1", features = ["serde", "v4"] }
unicode-normalization = "0.1.24"
