name: バグ報告
description: 困ったことや不具合を知らせてください
title: "[バグ] "
body:
  - type: markdown
    attributes:
      value: |
        コードではなく再現手順やアイデアを書いてください。
  - type: textarea
    id: action
    attributes:
      label: 何をした
      description: 不具合が起きるまでにしたことを書いてください。
      placeholder: 例：画面を開いて、ボタンを押しました。
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 何が起きた
      description: 実際に起きたことを書いてください。
      placeholder: 例：画面が閉じました。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期待
      description: どうなってほしかったかを書いてください。
      placeholder: 例：画面が開いたままになってほしいです。
    validations:
      required: true
