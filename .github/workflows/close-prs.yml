name: Close pull requests

on:
  pull_request:
    types: [opened]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  close:
    runs-on: ubuntu-latest
    steps:
      - name: Explain policy and close pull request
        uses: actions/github-script@v7
        with:
          script: |
            const body = 'ご提案ありがとうございます。CooSenpAIでは現在、プルリクエストを受け付けていないため、このプルリクエストをクローズします。\nThank you for your contribution. CooSenpAI is not accepting pull requests at this time, so this pull request will be closed.';
            const { owner, repo } = context.repo;
            const pullRequestNumber = context.payload.pull_request.number;

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: pullRequestNumber,
              body,
            });

            await github.rest.pulls.update({
              owner,
              repo,
              pull_number: pullRequestNumber,
              state: 'closed',
            });
