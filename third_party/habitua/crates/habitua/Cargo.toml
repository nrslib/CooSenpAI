[package]
name = "habitua"
version = "0.1.0"
edition = "2024"
description = "A replaceable habituation engine for arbitrary feature vectors"
repository = "https://github.com/nrslib/habitua"
license = "MIT OR Apache-2.0"
publish = false
readme = "../../README.md"
keywords = ["habituation", "novelty", "anomaly-detection", "feature-vector"]
categories = ["algorithms", "science"]

[dependencies]

[lib]
path = "src/lib.rs"

[dev-dependencies]
criterion = "0.5"
proptest = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bench]]
name = "observe"
harness = false
