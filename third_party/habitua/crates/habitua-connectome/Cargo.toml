[package]
name = "habitua-connectome"
version = "0.1.0"
edition = "2024"
autobins = false
description = "A CPU firing-rate model for the MaleCNS connectome"
repository = "https://github.com/nrslib/habitua"
license = "MIT OR Apache-2.0"
publish = false
readme = "../../README.md"
keywords = ["connectome", "neuroscience", "simulation", "rate"]
categories = ["science", "simulation"]

[features]
default = []
data-prep = ["dep:parquet"]

[dependencies]
habitua = { version = "0.1.0", path = "../habitua" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
rand = "0.9"
libc = "0.2"
png = "0.17"
parquet = { version = "59.3.0", optional = true }

[[bin]]
name = "connectome-data"
path = "src/bin/connectome-data.rs"
required-features = ["data-prep"]

[[bin]]
name = "connectome-helper"
path = "src/bin/connectome-helper.rs"

[[bin]]
name = "connectome-ratemodel"
path = "src/bin/connectome-ratemodel.rs"
